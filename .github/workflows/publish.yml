name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.npm-publish.outputs.published || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs the pnpm from `packageManager` and Node.js 24 and runs
      # `pnpm install --frozen-lockfile`. The release job skips the store cache.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - run: pnpm check:moonbit-version

      - run: pnpm test

      - run: pnpm build

      - run: pnpm typecheck

      - name: Package MoonBit module
        run: moon -C packages/agent-finder package

      # The release PR is opened with GITHUB_TOKEN, and GitHub does not start
      # workflows for events that token causes, so CI does not run on it by
      # itself. Before merging, close and reopen the PR (or push an empty commit
      # to its branch) as a person: `gh pr close <n> && gh pr reopen <n>`.
      # A `gh workflow run` dispatch is not attached to the PR and does not count.
      - name: Create release pull request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
        env:
          # changelog-github reads PR titles and authors through the API
          GITHUB_TOKEN: ${{ github.token }}

      # `changeset publish` runs `pnpm publish`, which sends each package to its
      # publishConfig.registry with an npm trusted-publishing (OIDC) token from
      # `id-token: write`, and attaches provenance itself because this
      # repository and the packages are public. No .npmrc or token is needed.
      - name: Publish to npm
        id: npm-publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          pnpm release
          echo "published=true" >> "$GITHUB_OUTPUT"

  publish-moonbit:
    needs: publish
    if: ${{ needs.publish.outputs.published == 'true' }}
    concurrency: ${{ github.workflow }}-moonbit-${{ github.ref }}
    uses: ./.github/workflows/moonbit-publish.yml
    secrets: inherit
