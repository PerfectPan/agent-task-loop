name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from `packageManager` and Node.js 24, restores the pnpm
      # store cache, and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - run: pnpm format:check

      - run: pnpm check:moonbit-version

      - run: pnpm test

      - run: pnpm build

      - run: pnpm typecheck

      # Type-aware lint resolves workspace packages through their built `dist` types
      # and room-web through the route types `pnpm typecheck` generates.
      - run: pnpm lint
