packages:
  - 'packages/*'
  - 'apps/*'

# Keep pnpm's one-day delay for third-party dependencies. Owned Rivus packages
# need immediate validation across repositories after publication.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@rivus/*'

# pnpm runs no dependency build scripts unless listed here.
allowBuilds:
  # Its postinstall verifies the platform binary that tsx and Vite run.
  esbuild: true
  # Prebuilt @img/sharp-* binaries cover every CI and dev platform; the script only matters for a source build.
  sharp: false
  # @rivus/agent's dependencies. @google/genai's preinstall is an echo, and
  # protobufjs's postinstall only warns about outdated dependents.
  '@google/genai': false
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
