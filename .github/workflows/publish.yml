# npm Trusted Publishing is registered against this file name; renaming it requires changing the package's trusted
# publisher on npmjs.com first. The release jobs come from the shared workflow in PerfectPan/gh-repo-checks;
# docs/npm-publish.md describes how this repository uses it.
name: Publish Package

on:
  push:
    branches:
      - main
  # Rebuilds the version pull request from the current main, or retries a failed publish.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: PerfectPan/gh-repo-checks/.github/workflows/npm-release.yml@v1
    # The shared workflow narrows these per job; only its publish job can request an OIDC token.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      # The repository has no `check` script; these are the release gates its publish ran before.
      check-command: pnpm test && pnpm build && pnpm typecheck
      # The private apps under apps/ never reach npm, so their advisories do not block a package release.
      audit-command: pnpm --filter '!./apps/**' audit --prod --audit-level=high
