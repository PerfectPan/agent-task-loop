name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from `packageManager` and the Node.js range in `devEngines.runtime`, restores the pnpm
      # store cache, and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          runtime: node
          cache: true
          require-lockfile: true

      # A pending record that names only a private or ignored package is never consumed and blocks every release.
      - uses: PerfectPan/gh-repo-checks@v1
        with:
          check: release-plan

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - run: pnpm typecheck

      # Type-aware lint resolves workspace packages through their built `dist` types
      # and room-web through the route types `pnpm typecheck` generates.
      - run: pnpm lint
