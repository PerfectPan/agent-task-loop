name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changelog-github reads PR titles and authors through the API, so the version PR links every change.
          fetch-depth: 0
          # Keeps the write token out of .git/config while repository code runs; the action pushes commits, tags
          # and Releases through the GitHub API with its own token.
          persist-credentials: false

      # Installs the pnpm from `packageManager` and Node.js 24 and runs
      # `pnpm install --frozen-lockfile`. The release job skips the store cache.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - uses: changesets/action/select-mode@v2.1.2
        id: mode

      - name: Create release pull request or publish
        if: steps.mode.outputs.mode != 'none'
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-draft: always
        env:
          # changelog-github reads PR titles and authors through the API
          GITHUB_TOKEN: ${{ github.token }}
