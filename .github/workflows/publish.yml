name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changelog-github reads PR titles and authors through the API, so the version PR links every change.
          fetch-depth: 0
          # Keeps the write token out of .git/config while repository code runs; the action pushes commits, tags
          # and Releases through the GitHub API with its own token.
          persist-credentials: false

      # Installs the pnpm from `packageManager` and Node.js 24 and runs
      # `pnpm install --frozen-lockfile`. The release job skips the store cache.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - run: pnpm test

      - run: pnpm build

      - run: pnpm typecheck

      # GITHUB_TOKEN-created PR events can require a maintainer to approve workflow runs.
      # This release flow does not force Draft. If the PR is Draft, mark it Ready
      # before expecting full CI; verify that test actually ran and passed, not skipped.
      #
      # With pending changesets, opens or updates the release PR. Without them, `pnpm release`
      # runs `changeset publish`, which runs `pnpm publish` for each unpublished version: pnpm
      # sends it to publishConfig.registry with an npm trusted-publishing (OIDC) token from
      # `id-token: write` and attaches provenance itself because this repository and the
      # packages are public. No .npmrc or token is needed. The action then pushes one tag per
      # published package and creates its GitHub Release after the publish succeeded; commits
      # and tags go through the GitHub API, so they are signed.
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          # changelog-github reads PR titles and authors through the API
          GITHUB_TOKEN: ${{ github.token }}
